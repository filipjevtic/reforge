services:
  web:
    image: mycompany/web:latest
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: prod-secret
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
  redis:
    image: redis:7
